<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Food Map</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f5f5f5;
            color: #1a1a1a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 60px 20px;
        }
        h1 {
            font-size: 32px;
            font-weight: 600;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }
        .subtitle {
            font-size: 15px;
            color: #666;
            margin-bottom: 48px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            width: 100%;
            max-width: 860px;
        }
        a.card {
            background: white;
            border-radius: 12px;
            padding: 28px 24px;
            text-decoration: none;
            color: inherit;
            box-shadow: 0 2px 12px rgba(0,0,0,0.07);
            transition: box-shadow 0.2s, transform 0.2s;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        a.card:hover {
            box-shadow: 0 8px 28px rgba(0,0,0,0.12);
            transform: translateY(-2px);
        }
        .card-flag { font-size: 32px; }
        .card-city {
            font-size: 18px;
            font-weight: 600;
            margin-top: 6px;
        }
        .card-label {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }
        footer {
            margin-top: 60px;
            font-size: 12px;
            color: #aaa;
        }
        footer a { color: #888; }
    </style>
</head>
<body>
    <h1>Open Food Map</h1>
    <p class="subtitle">Discover underrated restaurants and cafes, city by city.</p>

    <div class="grid">
        <a class="card" href="amsterdam_restaurants_interactive.html">
            <span class="card-flag">🇳🇱</span>
            <span class="card-city">Amsterdam</span>
            <span class="card-label">View map</span>
        </a>
        <a class="card" href="dublin_restaurants_interactive.html">
            <span class="card-flag">🇮🇪</span>
            <span class="card-city">Dublin</span>
            <span class="card-label">View map</span>
        </a>
        <a class="card" href="london_restaurants_interactive.html">
            <span class="card-flag">🇬🇧</span>
            <span class="card-city">London</span>
            <span class="card-label">View map</span>
        </a>
        <a class="card" href="miami_restaurants_interactive.html">
            <span class="card-flag">🇺🇸</span>
            <span class="card-city">Miami</span>
            <span class="card-label">View map</span>
        </a>
        <a class="card" href="new_york_restaurants_interactive.html">
            <span class="card-flag">🇺🇸</span>
            <span class="card-city">New York</span>
            <span class="card-label">View map</span>
        </a>
    </div>

    <footer>
        <a href="https://github.com/ACheng10/glasgow-food-map" target="_blank">View on GitHub</a>
    </footer>
</body>
</html>
